name: mobile
description: "Apnivaas — PG management"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.0+13

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # cupertino_icons is DELIBERATELY ABSENT. It ships one thing — the CupertinoIcons font — and
  # this app draws zero CupertinoIcons glyphs; every icon is Material, via uses-material-design
  # below. The CupertinoPageTransitionsBuilder in lib/core/theme/theme.dart comes from the SDK's
  # package:flutter/cupertino.dart and does NOT need this package, which is the reason it kept
  # getting re-added.
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  supabase_flutter: ^2.17.2
  # drift, drift_dev, sqlite3_flutter_libs and build_runner are DELIBERATELY ABSENT. They were
  # added for an on-device cache that was never built, and the tree proves it: no DriftDatabase,
  # no @DataClassName, no LazyDatabase, no build.yaml, and not one generated .g.dart anywhere.
  # Every screen reads Supabase directly through lib/data/repositories. Between them they carried
  # a per-ABI native SQLite build (sqlite3_flutter_libs bundles libsqlite3) and a code generator
  # with nothing to generate. If an offline cache is built later, all four come back together.
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0

  # ONLINE PAYMENT IS BACK IN THE APP. This was absent for v1, when rent was taken only at the
  # warden's desk; the rule "everything has to be done in the application" is what brought it
  # back. The two companions the removal note named have been restored with it: the version pin
  # in android/build.gradle.kts (this plugin declares com.razorpay:checkout:1.6.+, and a dynamic
  # range cannot resolve offline) and the R8 keeps in android/app/proguard-rules.pro (the SDK
  # builds its payment screens reflectively and is blank without them).
  razorpay_flutter: ^1.4.5
  # ── PUSH NOTIFICATIONS, ADDED 2026-09-12 IN THE ORDER THE REMOVAL NOTE PRESCRIBED ────────
  #
  # These two were removed once before, and the note left behind said exactly how to bring them
  # back: "create a Firebase project, put its google-services.json in android/app/, apply the
  # google-services plugin, add both packages back, then write the code that asks for a token and
  # a server path that sends to it. The packages are the LAST step, not the first."
  #
  # The server path exists (supabase/functions/push-send, and the trigger that calls it), the
  # client code exists (lib/core/notify/), and the Gradle plugin is applied CONDITIONALLY — only
  # when android/app/google-services.json is present. So the state the removal note warned about
  # — several MB of native library no code path can reach — is not the state this is in: the only
  # missing piece is the project file, which belongs to whoever owns the Play listing, and the app
  # runs unchanged without it (Firebase.initializeApp is guarded and push simply stays off).
  #
  # DATA SAFETY: the FCM registration token is a device identifier and is declared as one —
  # docs/data-safety.md §3.5. FCM does not pull in play-services-ads-identifier (Analytics does,
  # and Analytics is deliberately absent), and the manifest removes AD_ID explicitly.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # Android does NOT show an FCM notification while the app is in the foreground, and it drops any
  # notification whose channel does not exist — silently, with nothing in logcat naming the cause.
  # This package creates the `nivora_default` channel at startup (the same id push-send sends to)
  # and draws the banner for messages that arrive while somebody is looking at the app.
  flutter_local_notifications: ^22.3.0

  # POST_NOTIFICATIONS is a runtime permission from Android 13, and CAMERA became mandatory the
  # moment the manifest declared it: ACTION_IMAGE_CAPTURE throws SecurityException for an app that
  # holds the declaration without the grant. Both are asked for in words first — see
  # lib/core/notify/ and lib/data/capture.dart.
  permission_handler: ^13.0.2

  share_plus: ^13.3.0
  image_picker: ^1.2.3

  # "Continue with Google" (2026-10-17). On Android this is Credential Manager: Google's own
  # account sheet, drawn by the system, no browser and no web view — the rule is "nothing goes to
  # the browser". It yields an ID token and nothing else; the token goes to the mobile-auth Edge
  # Function, never straight to GoTrue (lib/core/auth/google_id_token.dart says why). crypto is
  # for the nonce: Google is handed sha256(raw), the server is handed raw and checks the pair.
  google_sign_in: ^7.2.0
  crypto: ^3.0.6
  # PRECISE LOCATION (round 3): the owner's PG pin and a tenant's "PGs near you", one fix each,
  # asked for in words first; never stored for a tenant. Its fused client also shows Play
  # services' in-app "Turn on location" dialog (lib/data/device/signup_device.dart).
  geolocator: ^14.0.1
  # Round 3 biometric app lock (on-device only). Needs FlutterFragmentActivity.
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the REAL app on a REAL device against the REAL backend. The 1,194 tests in test/ all
  # run against fakes, which is right for what they check and blind to everything that only
  # breaks when a network, a session and RLS are involved: a policy that refuses a read, a
  # provider that never resolves, a screen that renders on fixtures and throws on production
  # shapes. integration_test/ closes that gap. See integration_test/walkthrough_test.dart.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # THE TYPEFACES ARE DECLARED BELOW, under `fonts:` — Outfit and Manrope, seven static files in
  # google_fonts/. See the note there. The directory is NOT listed as an asset: `fonts:` bundles
  # the seven files it names, and nothing else in the folder should ship.
  assets:
    # THE LAUNCH ANIMATION and the still it settles on (reduce-motion shows the still). Built by
    # `node scripts/gen-icons.mjs --splash`; see lib/features/splash/splash_screen.dart.
    #
    # Listed FILE BY FILE, not as the assets/brand/ directory, on purpose: that folder also holds
    # the transparent masters the icons are cut from (apnivaas_mark.png, apnivaas_lockup.png,
    # about 3.3 MB together), and declaring the directory would ship them inside every APK.
    - assets/brand/apnivaas_splash.webp
    - assets/brand/apnivaas_splash_still.webp
    # The sign-in screen's logo: 480px wide, cut from apnivaas_mark.png (round 3).
    - assets/brand/apnivaas_logo.webp

    # THE PREVIOUS EMPTY-STATE ARTWORK. Four wordless two-ink PNGs (480px, ~87KB together) drawn
    # for the old dark design. Nothing draws them now: each EmptyArt constant names a first-run
    # state and EmptyArt.clayFor maps it to a clay icon. They stay declared because the
    # constants' paths are their identity and test/illustration_assets_test.dart holds the
    # bundle to them; see lib/shared/illustrations.dart for when they can go.
    - assets/illustrations/

    # THE CLAY ICONS. 54 WebPs with alpha, ~585KB together against 4.1MB for the source PNGs in
    # design-3d/. lib/shared/clay/clay_icons.dart names every file, and
    # ClayIcons.all is what a test checks against this folder. The directory is declared rather
    # than the paths for the same reason as the illustrations above. What is deliberately NOT in
    # here — role-seeker, role-owner-man, role-owner-mascot — is listed in that file's header.
    - assets/clay/

  # THE TYPEFACES SHIP WITH THE APP. Nothing is fetched. TWO FAMILIES: Outfit and Manrope.
  #
  # Outfit sets headings and display figures; Manrope sets everything a person reads. Why the
  # pair, and which slot gets which, is lib/core/theme/typography.dart.
  #
  # DECLARED FAMILIES, NOT google_fonts. The Inter era resolved its faces through
  # `GoogleFonts.inter`, which matched a bundled `Inter-<Variant>.ttf` by filename and gave every
  # style a per-weight family name — so a `copyWith(fontWeight: …)` at a call site changed the
  # number and kept the old face, silently. With the families declared here the engine picks
  # the face from the weight, the faces are registered before the first frame (google_fonts
  # loaded them on first use), and nothing can download: the theme never calls google_fonts.
  # GoogleFonts.config.allowRuntimeFetching = false stays in main.dart so that stays true even
  # if somebody reaches for `GoogleFonts.x` later.
  #
  # SEVEN STATIC FILES, EACH THE EXACT FILE google_fonts 8.2.1 WOULD HAVE FETCHED: downloaded
  # from fonts.gstatic.com by the sha256 the package lists for that weight, and checked against
  # that sha256 and byte length. Adding a weight to a TextStyle without adding its face here
  # lands on the nearest declared face, so ship the file first.
  #
  # EVERY FILE IS A DISTINCT FACE, AND THAT WAS CHECKED RATHER THAN ASSUMED. This project has
  # twice shipped byte-identical files under different weight names, which registers N copies of
  # the same face and makes every heading render regular while the pubspec looks correct. The
  # seven files have seven different `glyf` tables and OS/2 usWeightClass values that match the
  # `weight:` beside them; test/theme_contrast_test.dart reads both off the files.
  #
  # INTER IS GONE FROM THE APP, and Plus Jakarta Sans before it. Do not re-add a family without a
  # design that shows one. The four Inter files still sit in google_fonts/ for one reason:
  # scripts/make-feature-graphic.py sets the Play feature graphic in them. They do not ship —
  # nothing above names them — and they can go when that script moves to Outfit and Manrope.
  fonts:
    - family: Outfit
      fonts:
        - asset: google_fonts/Outfit-Medium.ttf
          weight: 500
        - asset: google_fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: google_fonts/Outfit-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: google_fonts/Manrope-Regular.ttf
          weight: 400
        - asset: google_fonts/Manrope-Medium.ttf
          weight: 500
        - asset: google_fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: google_fonts/Manrope-Bold.ttf
          weight: 700
