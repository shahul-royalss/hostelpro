<style>
        .glass-card {
            background-color: theme('colors.glass-fill');
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

        }

            background-color: theme('colors.surface-container-lowest');
            border: 1px solid theme('colors.surface-variant');
            transition: all 0.2s ease-in-out;
        }

            border-color: theme('colors.primary-container');

<body class="bg-background-ivory text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary">
<!-- Header Navigation (Simplified for transactional page) -->
<header class="w-full top-0 left-0 bg-transparent flat no shadows z-50">
<div class="flex justify-between items-center w-full px-page-margin-mobile md:px-page-margin-desktop py-6 max-w-7xl mx-auto">
<div class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed tracking-tight">
                Lumina Hostels
            </div>
<div class="hidden md:flex gap-6 items-center">
<button class="text-text-muted dark:text-on-surface-variant hover:opacity-80 transition-opacity font-body-md text-body-md flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="help">help</span>
                    Support
                 </button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-page-margin-mobile md:p-page-margin-desktop relative overflow-hidden">
<!-- Abstract Background Ornaments -->
<div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] rounded-full bg-status-sand opacity-5 blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[35vw] h-[35vw] rounded-full bg-accent-teal opacity-[0.03] blur-[100px] pointer-events-none"></div>
<div class="w-full max-w-md relative z-10">
<!-- Glassmorphism Card -->
<div class="glass-card rounded-[20px] p-8 md:p-10 flex flex-col">
<div class="mb-8 text-center">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-fixed-dim/20 text-primary-container mb-6">
<span class="material-symbols-outlined text-2xl" data-icon="lock_reset" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
<h1 class="font-stat-display text-stat-display text-primary mb-3">Set a new password</h1>
<p class="font-body-md text-body-md text-text-muted">A temporary password was issued for your account. Please create a permanent one below to continue.</p>
</div>
<form class="flex flex-col gap-5">
<!-- New Password Input -->
<div class="flex flex-col gap-2 relative">
<label class="font-headline-md text-headline-md text-text-charcoal" for="new_password">New Password</label>
<div class="relative">
<input class="input-field w-full rounded-xl py-3 pl-4 pr-10 font-body-md text-body-md text-on-surface placeholder:text-text-muted" id="new_password" placeholder="Enter new password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="mt-1">
<div class="flex gap-1 h-1 w-full rounded-full overflow-hidden bg-surface-variant">
<div class="h-full bg-accent-teal w-1/3 transition-all duration-300"></div>
</div>
<p class="font-label-caps text-label-caps text-text-muted mt-2">Password strength: Weak</p>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-2 relative mt-2">
<label class="font-headline-md text-headline-md text-text-charcoal" for="confirm_password">Confirm Password</label>
<div class="relative">
<input class="input-field w-full rounded-xl py-3 pl-4 pr-10 font-body-md text-body-md text-on-surface placeholder:text-text-muted" id="confirm_password" placeholder="Re-enter new password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Action -->
<div class="mt-6">
<button class="w-full bg-primary-container text-on-primary rounded-[12px] py-3.5 px-6 font-headline-md text-headline-md hover:bg-primary transition-colors duration-200 flex justify-center items-center gap-2 shadow-sm" type="submit">
                            Save &amp; continue
                            <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Bottom Helper -->
<div class="mt-8 text-center">
<a class="font-body-md text-body-md text-text-muted hover:text-primary transition-colors inline-flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_back">arrow_back</span>
                    Return to login
                </a>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full bottom-0 bg-transparent flat no shadows z-40 mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center w-full px-page-margin-mobile md:px-page-margin-desktop py-8 gap-4 max-w-7xl mx-auto border-t border-glass-border">

                © 2024 Lumina Systems. All rights reserved.
            </div>
<div class="flex gap-6 font-label-caps text-label-caps">

<a class="text-text-muted hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#">Terms of Service</a>
<a class="text-text-muted hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#">Contact</a>
</div>
</div>
</footer>
