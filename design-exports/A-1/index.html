                            "text-muted": "#6E7480",

                            "surface-dim": "#dbd9dc",
                            "accent-teal": "#3E7C74",

                            "on-error-container": "#93000a",

                    "borderRadius": {

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.50);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.04);
        }
        
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(28,43,69,0.1) 0%, rgba(62,124,116,0.1) 50%, rgba(246,244,239,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-background-ivory min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md text-body-md text-text-charcoal antialiased">
<!-- Ambient Glow Background -->
<div class="ambient-glow"></div>
<main class="w-full max-w-md px-page-margin-mobile md:px-page-margin-desktop z-10 relative">
<!-- Frosted Glass Login Card -->
<div class="glass-card rounded-[20px] p-8 md:p-10 w-full flex flex-col gap-8">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-2">
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center mb-2 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-2xl" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Stitch UI</h1>
<p class="text-text-muted">Sign in to your hostel workspace</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-text-charcoal" for="email">Email or Phone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-lg pointer-events-none">mail</span>
<input class="w-full bg-background-ivory border border-outline-variant rounded-[12px] py-2.5 pl-10 pr-4 text-text-charcoal focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none placeholder:text-text-muted/50" id="email" placeholder="workspace@stitch.ui" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-text-charcoal" for="password">Password</label>
<a class="font-label-caps text-label-caps text-accent-teal hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-lg pointer-events-none">lock</span>
<input class="w-full bg-background-ivory border border-outline-variant rounded-[12px] py-2.5 pl-10 pr-10 text-text-charcoal focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none placeholder:text-text-muted/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-charcoal transition-colors focus:outline-none flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="mt-2">
<button class="w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-3 rounded-[12px] hover:opacity-90 transition-opacity active:scale-[0.98] shadow-sm flex items-center justify-center gap-2" type="submit">
                        Sign in
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Footer Text -->
<div class="mt-8 text-center w-full">
<p class="font-label-caps text-label-caps text-text-muted">© 2024 Stitch UI. All rights reserved.</p>
</div>
</main>
<script>
        // Simple password visibility toggle
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>
</body></html>
