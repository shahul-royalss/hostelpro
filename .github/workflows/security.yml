name: Security

# GOD-MODE checklist §23 — security scanning runs automatically on every push and PR.
# All four gates below run without any secret, so forks and PRs are covered too.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, so newly-disclosed CVEs surface even with no commits

# Actions are pinned to full commit SHAs, not tags: a tag is a mutable pointer that its
# owner (or anyone who steals a maintainer token) can repoint at new code, which every
# workflow then picks up with no diff and no review. The trailing version comment is what
# Dependabot reads to offer the bump. SHAs verified against the GitHub API on 2026-08-20.
permissions:
  contents: read

jobs:
  static-analysis:
    name: Types, lint, SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint + eslint-plugin-security (SAST)
        run: npm run lint:sast

  secrets-and-supply-chain:
    name: Secret scan, backdoor audit, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the secret scan walks every commit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret scan (working tree + full git history) + backdoor audit + npm audit
        run: npm run security:scan
      - name: Fail on critical/high production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: next build
        # Build-time only needs the public values; they are not secrets.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npx next build
      - name: Assert no server secret reached the client bundle
        run: |
          if grep -rlE '"role"[[:space:]]*:[[:space:]]*"service_role"|sb_secret_|SUPER_ADMIN_PASSWORD' .next/static; then
            echo "::error::A server secret is present in the client bundle"; exit 1
          fi
          echo "client bundle clean"
